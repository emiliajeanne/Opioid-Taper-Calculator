<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opioid Taper Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; padding: 2rem 1rem; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 0.25rem; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 1.5rem; }
    .container { max-width: 780px; margin: 0 auto; }
    .section { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .section-title { font-size: 12px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .field-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 13px; color: #555; }
    select, input[type="number"] { font-size: 14px; padding: 7px 10px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; background: #fff; color: #1a1a1a; width: 100%; outline: none; }
    select:focus, input:focus { border-color: rgba(0,0,0,0.4); box-shadow: 0 0 0 2px rgba(0,0,0,0.06); }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1rem; }
    .metric { background: #f5f5f3; border-radius: 8px; padding: 0.75rem 1rem; }
    .metric-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .metric-value { font-size: 22px; font-weight: 500; color: #1a1a1a; }
    .metric-unit { font-size: 11px; color: #888; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { font-size: 12px; font-weight: 500; color: #888; text-align: left; padding: 6px 8px; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
    td { padding: 7px 8px; border-bottom: 0.5px solid rgba(0,0,0,0.07); color: #1a1a1a; }
    tr:last-child td { border-bottom: none; }
    .alt-row td { background: #fafafa; }
    .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .badge-warn { background: #FAEEDA; color: #633806; }
    .badge-ok { background: #EAF3DE; color: #27500A; }
    .badge-danger { background: #FCEBEB; color: #501313; }
    .info-banner { font-size: 12px; padding: 8px 12px; margin-bottom: 10px; border-radius: 8px; background: #E6F1FB; color: #0C447C; border-left: 2px solid #378ADD; line-height: 1.5; }
    .warn-box { font-size: 12px; padding: 6px 10px; margin-bottom: 6px; border-radius: 8px; line-height: 1.5; }
    .warn-danger { background: #FCEBEB; color: #501313; }
    .warn-warn { background: #FAEEDA; color: #633806; }
    .la-steps { font-size: 12px; color: #555; background: #f5f5f3; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.75rem; line-height: 1.7; }
    .note { font-size: 12px; color: #666; margin-top: 0.75rem; line-height: 1.6; padding: 0.75rem; background: #f5f5f3; border-radius: 8px; border-left: 2px solid rgba(0,0,0,0.15); }
    @media (max-width: 560px) {
      .field-row, .field-row.three { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Opioid Taper Calculator</h1>
  <p class="subtitle">For outpatient/primary care use. Generates a starting taper framework — reassess at every visit.</p>

  <div class="section">
    <div class="section-title">Current medication</div>
    <div class="field-row">
      <div class="field">
        <label>Opioid</label>
        <select id="drug" onchange="recalc()">
          <option value="morphine">Morphine IR</option>
          <option value="morphine_er">Morphine ER</option>
          <option value="oxycodone">Oxycodone IR</option>
          <option value="oxycodone_er">Oxycodone ER (OxyContin)</option>
          <option value="hydrocodone">Hydrocodone IR</option>
          <option value="hydrocodone_er">Hydrocodone ER (Hysingla/Zohydro)</option>
          <option value="hydromorphone">Hydromorphone IR</option>
          <option value="hydromorphone_er">Hydromorphone ER (Exalgo)</option>
          <option value="tramadol">Tramadol IR</option>
          <option value="tramadol_er">Tramadol ER</option>
          <option value="codeine">Codeine</option>
          <option value="buprenorphine">Buprenorphine (mcg/hr patch)</option>
          <option value="fentanyl">Fentanyl (mcg/hr patch)</option>
          <option value="methadone">Methadone</option>
        </select>
      </div>
      <div class="field">
        <label>Dose per administration (mg)</label>
        <input type="number" id="dose" value="30" min="0.1" step="0.5" oninput="recalc()" />
      </div>
    </div>
    <div class="field-row three">
      <div class="field">
        <label>Doses per day</label>
        <input type="number" id="freq" value="3" min="1" max="12" step="1" oninput="recalc()" />
      </div>
      <div class="field">
        <label>Patient age</label>
        <select id="age" onchange="recalc()">
          <option value="adult">Adult (18–64)</option>
          <option value="elderly">Elderly (65+)</option>
        </select>
      </div>
      <div class="field">
        <label>Goal</label>
        <select id="goal" onchange="recalc()">
          <option value="discontinue">Full discontinuation</option>
          <option value="reduce50">Reduce by 50%</option>
          <option value="reduce75">Reduce by 75%</option>
          <option value="mme90">Reach &lt;90 MME/day</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Therapy history &amp; taper parameters</div>
    <div class="field-row">
      <div class="field">
        <label>Duration of opioid therapy</label>
        <select id="duration" onchange="recalc()">
          <option value="days">Days</option>
          <option value="weeks">Weeks</option>
          <option value="months_lt1">Months (less than 1 year)</option>
          <option value="years_gt1" selected>Greater than 1 year</option>
        </select>
      </div>
      <div class="field">
        <label>Taper velocity override</label>
        <select id="velocityOverride" onchange="recalc()">
          <option value="auto">Auto (based on duration)</option>
          <option value="slowest">Slowest — 2–5% / 1–2 months</option>
          <option value="slow">Slow — 5–20% / 4 weeks</option>
          <option value="fast">Fast — 10–20% / week</option>
          <option value="fastest">Fastest — 20–50% / day (acute)</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Taper method</label>
        <select id="method" onchange="recalc()">
          <option value="dose">Reduce dose amount</option>
          <option value="freq">Reduce dose frequency</option>
          <option value="qty">Reduce monthly quantity</option>
        </select>
      </div>
      <div class="field">
        <label>Show schedule in</label>
        <select id="unit" onchange="recalc()">
          <option value="weeks">Weeks</option>
          <option value="months">Months</option>
        </select>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Summary</div>
    <div id="velocity-banner"></div>
    <div id="la-note"></div>
    <div class="metric-grid" id="metrics"></div>
    <div id="warning-box"></div>
  </div>

  <div class="section">
    <div class="section-title">Taper schedule</div>
    <div id="schedule-wrap"></div>
    <div class="note" id="clinical-note"></div>
  </div>
</div>

<script>
const MME = {
  morphine:1,morphine_er:1,oxycodone:1.5,oxycodone_er:1.5,
  hydrocodone:1,hydrocodone_er:1,hydromorphone:4,hydromorphone_er:4,
  tramadol:0.1,tramadol_er:0.1,codeine:0.15,
  buprenorphine:12.6,fentanyl:2.4,methadone:8
};
const isLA = {
  morphine_er:true,oxycodone_er:true,hydrocodone_er:true,
  hydromorphone_er:true,tramadol_er:true,fentanyl:true,
  buprenorphine:true,methadone:true
};
const durationVelocity = {
  days:       {pct:0.35, intervalWeeks:0.14, label:'Fastest — 20–50%/day',          intervalLabel:'daily'},
  weeks:      {pct:0.15, intervalWeeks:1,    label:'Fast — 10–20%/week',             intervalLabel:'weekly'},
  months_lt1: {pct:0.125,intervalWeeks:4,    label:'Slow — 5–20%/4 weeks',           intervalLabel:'every 4 weeks'},
  years_gt1:  {pct:0.06, intervalWeeks:6,    label:'Slowest — 2–10%/1–2 months',     intervalLabel:'every 6 weeks'}
};
const overrideVelocity = {
  slowest:{pct:0.06, intervalWeeks:6,    label:'Slowest — 2–5% / 1–2 months', intervalLabel:'every 6 weeks'},
  slow:   {pct:0.125,intervalWeeks:4,    label:'Slow — 5–20% / 4 weeks',      intervalLabel:'every 4 weeks'},
  fast:   {pct:0.15, intervalWeeks:1,    label:'Fast — 10–20% / week',        intervalLabel:'weekly'},
  fastest:{pct:0.35, intervalWeeks:0.14, label:'Fastest — 20–50% / day',      intervalLabel:'daily'}
};

function recalc() {
  const drug=document.getElementById('drug').value;
  const dose=parseFloat(document.getElementById('dose').value)||0;
  const freq=parseFloat(document.getElementById('freq').value)||1;
  const duration=document.getElementById('duration').value;
  const velocityOverride=document.getElementById('velocityOverride').value;
  const method=document.getElementById('method').value;
  const goal=document.getElementById('goal').value;
  const unit=document.getElementById('unit').value;
  const age=document.getElementById('age').value;

  const mmeConv=MME[drug]||1;
  const longActing=!!isLA[drug];
  const dailyMME=dose*freq*mmeConv;
  const vel=velocityOverride==='auto'?durationVelocity[duration]:overrideVelocity[velocityOverride];
  const {pct,intervalWeeks,label,intervalLabel}=vel;

  let targetMME;
  if(goal==='discontinue') targetMME=0;
  else if(goal==='reduce50') targetMME=dailyMME*0.5;
  else if(goal==='reduce75') targetMME=dailyMME*0.25;
  else targetMME=Math.min(90,dailyMME*0.5);

  const steps=[];
  let current=dailyMME,stepNum=0;
  while(current>targetMME+0.5&&stepNum<80){
    const next=Math.max(targetMME,current-current*pct);
    steps.push({step:stepNum,startMME:current,endMME:next,reductionMME:current*pct});
    current=next; stepNum++;
    if(next<=targetMME+0.1) break;
  }

  const totalWeeks=steps.length*intervalWeeks;

  document.getElementById('velocity-banner').innerHTML=
    `<div class="info-banner"><strong>Recommended velocity:</strong> ${label} — ${intervalLabel}${velocityOverride!=='auto'?' <em>(provider override)</em>':''}</div>`;

  document.getElementById('la-note').innerHTML=longActing?
    `<div class="la-steps"><strong>Long-acting opioid — recommended approach:</strong><br>
    1. Convert 50–75% of total daily MME to an IR equivalent; taper IR portion first.<br>
    2. Once IR is discontinued, taper the remaining LA dose per the schedule below.<br>
    3. Alternatively, convert entire dose to IR equivalent and taper that.<br>
    4. Patches (fentanyl/buprenorphine): step down through available strengths or convert to oral IR.</div>`:'';

  document.getElementById('metrics').innerHTML=`
    <div class="metric"><div class="metric-label">Starting MME/day</div><div class="metric-value">${Math.round(dailyMME)}</div><div class="metric-unit">morphine mg equivalents</div></div>
    <div class="metric"><div class="metric-label">Target MME/day</div><div class="metric-value">${Math.round(targetMME)}</div><div class="metric-unit">goal dose</div></div>
    <div class="metric"><div class="metric-label">Total reduction</div><div class="metric-value">${Math.round(((dailyMME-targetMME)/dailyMME)*100)}%</div><div class="metric-unit">of starting dose</div></div>
    <div class="metric"><div class="metric-label">Est. duration</div><div class="metric-value">${intervalWeeks<1?Math.round(totalWeeks*7)+'d':totalWeeks+'w'}</div><div class="metric-unit">${intervalWeeks>=1?'(~'+(totalWeeks/4.33).toFixed(1)+' mo)':'acute'}</div></div>
    <div class="metric"><div class="metric-label">Formulation</div><div class="metric-value" style="font-size:14px;padding-top:4px;">${longActing?'Long-acting':'Short-acting'}</div></div>`;

  const warnings=[];
  if(dailyMME>=90) warnings.push({level:'danger',text:'Starting MME ≥90 — high-risk. Naloxone required.'});
  else if(dailyMME>=50) warnings.push({level:'warn',text:'Starting MME ≥50 — consider naloxone co-prescription.'});
  if(drug==='methadone') warnings.push({level:'warn',text:'Methadone: QTc and unique PK risks. Specialist co-management recommended.'});
  if(drug==='fentanyl'||drug==='buprenorphine') warnings.push({level:'warn',text:'Patch: step down through available strengths or convert to oral IR for finer dose control.'});
  if(age==='elderly') warnings.push({level:'warn',text:'Elderly: use slowest taper. Higher fall, sedation, and withdrawal risk.'});
  if(intervalWeeks<1) warnings.push({level:'warn',text:'Daily taper: appropriate for acute/recent-onset only. Ensure close monitoring.'});

  document.getElementById('warning-box').innerHTML=warnings.map(w=>
    `<div class="warn-box ${w.level==='danger'?'warn-danger':'warn-warn'}">${w.text}</div>`).join('');

  let rows=steps.map((s,i)=>{
    let t;
    if(intervalWeeks<1) t='Day '+(s.step+1);
    else if(unit==='weeks') t='Wk '+(s.step*intervalWeeks+1)+'–'+((s.step+1)*intervalWeeks);
    else t='Mo '+(s.step*intervalWeeks/4.33).toFixed(1)+'–'+((s.step+1)*intervalWeeks/4.33).toFixed(1);
    const d=(s.startMME/mmeConv/freq).toFixed(1);
    const cls=s.endMME>=90?'badge-danger':s.endMME>=50?'badge-warn':'badge-ok';
    return `<tr class="${i%2===1?'alt-row':''}"><td>${t}</td><td>${d} mg ×${freq}/day</td><td>${Math.round(s.startMME)}</td><td>−${Math.round(s.reductionMME)} (${Math.round(pct*100)}%)</td><td><span class="badge ${cls}">${Math.round(s.endMME)} MME</span></td></tr>`;
  }).join('');

  if(!rows) rows=`<tr><td colspan="5" style="color:#888;text-align:center;padding:1rem;">Already at or below target.</td></tr>`;

  document.getElementById('schedule-wrap').innerHTML=`
    <table><thead><tr><th>Timeframe</th><th>Prescribed dose</th><th>MME/day (start)</th><th>Reduction</th><th>MME after step</th></tr></thead>
    <tbody>${rows}</tbody></table>`;

  const methodNotes={
    dose:'Reduce dose amount at each interval. When smallest available tablet unit is reached, switch to reducing frequency or monthly quantity.',
    freq:'Reduce number of daily doses at each interval (e.g., TID → BID → QD).',
    qty:'Reduce total monthly quantity by the target %. Instruct patient to use fewer doses on "good days."'
  };

  document.getElementById('clinical-note').innerHTML=
    `<strong>Method:</strong> ${methodNotes[method]}<br><br>
    <strong>Reminder:</strong> This is a starting framework. Reassess at every visit — pause or slow if withdrawal, functional decline, or distress emerge. Dose reduction alone is a valid goal. Obtain patient agreement before initiating and document all conversations.`;
}
recalc();
</script>
</body>
</html>
